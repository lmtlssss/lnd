# Branch-only validation harness. The fork master version is unchanged.
# Registered default workflow id enables manual dispatch on this feature ref.
name: SC LND genuine encrypted backup negative control
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  encrypted-backup-repro:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Run pinned LND chanbackup / encrypted MultiFile negative control
        run: go test ./chanbackup -run '^TestSubSwapperCloseFailureCannotResurrectDiskBackup$' -count=1 -timeout=12m -v
