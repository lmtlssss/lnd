name: Docker helper pin qualification (no registry access)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci-pin-docker-helper-actions-20261025
          persist-credentials: false
      - name: Validate exact Docker workflow syntax and security invariants
        shell: bash
        run: |
          set -euo pipefail
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.10 -shellcheck= .github/workflows/docker.yml
          python3 - <<'PY'
          from pathlib import Path
          s=Path(".github/workflows/docker.yml").read_text()
          commit="39555064b3ae5c6d5c71a8ab304355faeaf3f4d4"
          assert s.count("@"+commit)==4
          assert "2021.01.25.00" not in s
          assert "permissions:\n  contents: read" in s
          assert "secrets.DOCKER_API_KEY" in s
          assert "schedule:" in s and "tags:" in s
          assert "daily-testing-" in s
          assert "push: true" in s
          print("PASS: 7 Docker workflow source-policy gates")
          PY
      - name: Complete with no image publication
        run: echo "PASS GitHub token is read-only; registry secrets not requested"
